[package]
name = "lingyao-backend-engine"
description = "The query process lingyao-cloud runs once per request: one JSON request on stdin, one JSON response on stdout, answered by lingyao-engine from the pinned dictionary release. Replaces the C++ bridge that linked the archived LINGYAO-Engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "lingyao-backend-engine"
path = "src/main.rs"

[dependencies]
lingyao-engine = { path = "../engine" }
# Only for its Simplified to Traditional conversion (the OpenCC s2t tables), which the server's `convert` operation answers.
lingyao-client-core = { path = "../client-core" }

[lints]
workspace = true
