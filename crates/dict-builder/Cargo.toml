[package]
name = "lingyao-dict-builder"
description = "Builds the shipped dictionary artifacts (lingyao-pinyin.db, lingyao-wubi.db, lingyao-english.db, lingyao-others.db, lingyao-japanese.dat, lingyao-bigram.bin, lingyao-trigram.bin and the manifest) from pinned sources. Replaces the Python pipeline under LINGYAO-Engine dictionary/."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "lingyao-dict-build"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Streams the zhwiki dump; 0.6 defaults to the pure-Rust libbz2-rs-sys backend.
bzip2 = "0.6"
clap = { version = "4", features = ["derive"] }
csv = "1"
hex = "0.4"
html-escape = "0.2"
# Insertion-ordered maps: the Python pipeline iterates dicts in insertion order, and the n-gram tie-break and the emoji extras depend on it.
indexmap = { version = "2", features = ["serde"] }
# The quanpin table naming contract, shared with the runtime.
lingyao-engine = { path = "../engine" }
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { workspace = true, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-general-category.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
