name: Lingyao namespace audit

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit legacy names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          audit_file = ".github/workflows/lingyao-stage2.yml"
          failures = []

          def legal_content(p: Path) -> bool:
              s = p.as_posix().lower()
              n = p.name.upper()
              return (
                  p.as_posix() == "LICENSE"
                  or "/licenses/" in f"/{s}/"
                  or "LICENSE" in n
                  or "NOTICE" in n
                  or p.name.lower() == "copyright"
                  or p.name == "UPSTREAM.md"
              )

          # Valid compatibility/external references we cannot rename until the
          # corresponding external service/repository itself is moved.
          allowed = re.compile(
              r"https?://[^\s\"'<>)]*|"
              r"git\+https?://[^\s\"'<>)]*|"
              r"git@github\.com:[^\s\"'<>)]*|"
              r"Lcy040109/msime\b|"
              r"metasequoiaime/msime(?:[-A-Za-z0-9_.]*)?\b|"
              r"(?:[A-Za-z0-9-]+\.)*msime\.app(?::\d+)?|"
              r"[A-Za-z0-9._%+-]*msime[A-Za-z0-9._%+-]*@[A-Za-z0-9.-]+\.[A-Za-z]{2,}",
              re.I,
          )

          for p in Path(".").rglob("*"):
              if ".git" in p.parts or p.as_posix() == audit_file:
                  continue
              if re.search(r"msime|metasequoia|shuishan|水杉", p.name, re.I):
                  failures.append((p.as_posix(), "path"))
                  continue
              if not p.is_file() or legal_content(p):
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              text = allowed.sub("", text)
              if re.search(r"msime|metasequoia|shuishan|水杉", text, re.I):
                  failures.append((p.as_posix(), "content"))

          print(f"Unexpected legacy branding hits: {len(failures)}")
          for item in failures[:400]:
              print(*item)
          if failures:
              raise SystemExit(1)
          PY
