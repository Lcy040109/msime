name: Lingyao namespace repair audit

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair compatibility references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = [
              ("MSIME.app", "LINGYAO.app"),
              ("Application Support/metasequoiaime/skins", "Application Support/lingyao/skins"),
              ("Lcy040109/lingyao", "Lcy040109/msime"),
              ("metasequoiaime/lingyao-dictionary", "metasequoiaime/msime-dictionary"),
              ("metasequoiaime/lingyao-engine", "metasequoiaime/msime-engine"),
              ("metasequoiaime/lingyao-plugins", "metasequoiaime/msime-plugins"),
              ("metasequoiaime/lingyao-skins", "metasequoiaime/msime-skins"),
              ("metasequoiaime/lingyao-web", "metasequoiaime/msime-web"),
              ("metasequoiaime/LINGYAO-Windows", "metasequoiaime/MSIME-Windows"),
              ("metasequoiaime/LINGYAO-Apple", "metasequoiaime/MSIME-Apple"),
          ]

          def workflow(p):
              return len(p.parts) >= 2 and p.parts[0] == ".github" and p.parts[1] == "workflows"

          changed=[]
          for p in Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts or workflow(p):
                  continue
              try:
                  data=p.read_text(encoding="utf-8")
              except (UnicodeDecodeError,OSError):
                  continue
              new=data
              for old,repl in replacements:
                  new=new.replace(old,repl)
              if new!=data:
                  p.write_text(new,encoding="utf-8")
                  changed.append(p.as_posix())
          print(f"Compatibility/reference repairs: {len(changed)}")
          for p in changed[:100]:
              print(p)
          PY

      - name: Commit repairs
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Repair Lingyao compatibility and upstream references"
            git push origin HEAD:develop
          fi

      - name: Audit legacy names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          audit_file=".github/workflows/lingyao-stage2.yml"
          failures=[]

          def legal_content(p):
              s=p.as_posix().lower()
              n=p.name.upper()
              return (
                  p.as_posix()=="LICENSE"
                  or "/licenses/" in f"/{s}/"
                  or "LICENSE" in n
                  or "NOTICE" in n
                  or p.name.lower()=="copyright"
                  or p.name=="UPSTREAM.md"
              )

          allowed=re.compile(
              r"https?://[^\s\"'<>)]*|"
              r"git\+https?://[^\s\"'<>)]*|"
              r"git@github\.com:[^\s\"'<>)]*|"
              r"Lcy040109/msime\b|"
              r"metasequoiaime/[A-Za-z0-9_.-]+|"
              r"metasequoiaime\.github\.io|"
              r"metasequoiaime@gmail\.com|"
              r"(?:[A-Za-z0-9-]+\.)*msime\.app(?::\d+)?|"
              r"ppa:msime/ppa|"
              r"home:/?msime\b|"
              r"~msime\b|"
              r"\bmsime/msime\b|"
              r"aur\.archlinux\.org/msime(?:-bin)?\.git",
              re.I,
          )

          for p in Path(".").rglob("*"):
              if ".git" in p.parts or p.as_posix()==audit_file:
                  continue
              if re.search(r"msime|metasequoia|shuishan|水杉",p.name,re.I):
                  failures.append((p.as_posix(),"path"))
                  continue
              if not p.is_file() or legal_content(p):
                  continue
              try:
                  text=p.read_text(encoding="utf-8")
              except (UnicodeDecodeError,OSError):
                  continue
              check=allowed.sub("",text)
              if re.search(r"msime|metasequoia|shuishan|水杉",check,re.I):
                  failures.append((p.as_posix(),"content"))

          print(f"Unexpected internal legacy-name hits: {len(failures)}")
          for item in failures[:400]:
              print(*item)
          if failures:
              raise SystemExit(1)
          PY
