name: Regenerate edition contracts

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate Linux and Windows edition files
        shell: bash
        run: |
          python3 platforms/linux/scripts/edition_linux.py gen
          python3 platforms/windows/scripts/edition_windows.py gen
      - name: Commit generated files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated files already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate Lingyao edition contracts"
          git push origin HEAD:develop
