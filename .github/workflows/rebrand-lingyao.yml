name: Lingyao full rebrand

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy product branding with Lingyao
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")

          def legal_or_attribution(p: Path) -> bool:
              s = p.as_posix()
              name = p.name.upper()
              if s == "LICENSE":
                  return True
              if "/licenses/" in f"/{s.lower()}/":
                  return True
              if "LICENSE" in name or "NOTICE" in name or name == "UPSTREAM.MD":
                  return True
              if p.name.lower() == "copyright":
                  return True
              return False

          def workflow_file(p: Path) -> bool:
              return len(p.parts) >= 2 and p.parts[0] == ".github" and p.parts[1] == "workflows"

          replacements = [
              ("水杉输入法", "灵耀输入法"),
              ("水杉 IME", "灵耀 IME"),
              ("水杉", "灵耀"),
              ("Metasequoia IME", "Lingyao IME"),
              ("MetasequoiaIME", "LingyaoIME"),
              ("MetasequoiaIme", "LingyaoIme"),
              ("Metasequoia", "Lingyao"),
              ("METASEQUOIA", "LINGYAO"),
              ("SHUISHAN", "LINGYAO"),
              ("Shuishan", "Lingyao"),
              ("shuishan", "lingyao"),
          ]

          changed = []
          skipped_legal = []
          for p in root.rglob("*"):
              if not p.is_file() or ".git" in p.parts or workflow_file(p):
                  continue
              try:
                  data = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              if legal_or_attribution(p):
                  if re.search(r"水杉|Metasequoia|METASEQUOIA|shuishan|metasequoia", data, re.I):
                      skipped_legal.append(p.as_posix())
                  continue

              new = data

              # Repair companion/upstream repositories that were accidentally rewritten
              # by the earlier broad "metasequoiaime/msime" prefix replacement.
              new = new.replace("Lcy040109/msime-", "metasequoiaime/msime-")

              # Main repository links belong to this fork, but companion repos remain upstream.
              new = re.sub(
                  r"metasequoiaime/msime(?![-A-Za-z0-9_.])",
                  "Lcy040109/msime",
                  new,
                  flags=re.I,
              )

              # Protect real upstream dependency locations and the original upstream contact.
              protected = {
                  "__LINGYAO_UPSTREAM_ORG_SLASH__": "metasequoiaime/",
                  "__LINGYAO_UPSTREAM_EMAIL__": "metasequoiaime@gmail.com",
              }
              new = new.replace("metasequoiaime/", "__LINGYAO_UPSTREAM_ORG_SLASH__")
              new = new.replace("metasequoiaime@gmail.com", "__LINGYAO_UPSTREAM_EMAIL__")

              for old, repl in replacements:
                  new = new.replace(old, repl)

              # Remaining lowercase forms are internal product identifiers, bundle/vendor
              # names, data-dir markers, install directories, etc.
              new = new.replace("metasequoiaime", "lingyaoime")
              new = new.replace("metasequoia", "lingyao")

              for placeholder, original in protected.items():
                  new = new.replace(placeholder, original)

              if new != data:
                  p.write_text(new, encoding="utf-8")
                  changed.append(p.as_posix())

          # Rename brand-bearing paths deepest-first so source references stay aligned.
          candidates = sorted(
              [
                  p for p in root.rglob("*")
                  if ".git" not in p.parts and not workflow_file(p)
              ],
              key=lambda p: len(p.parts),
              reverse=True,
          )
          for p in candidates:
              old_name = p.name
              new_name = old_name
              for old, repl in [
                  ("MetasequoiaIME", "LingyaoIME"),
                  ("MetasequoiaIme", "LingyaoIme"),
                  ("Metasequoia", "Lingyao"),
                  ("METASEQUOIA", "LINGYAO"),
                  ("SHUISHAN", "LINGYAO"),
                  ("Shuishan", "Lingyao"),
                  ("shuishan", "lingyao"),
                  ("metasequoiaime", "lingyaoime"),
                  ("metasequoia", "lingyao"),
                  ("水杉", "灵耀"),
              ]:
                  new_name = new_name.replace(old, repl)
              if new_name != old_name and p.exists():
                  target = p.with_name(new_name)
                  if target.exists():
                      raise RuntimeError(f"rename collision: {p} -> {target}")
                  p.rename(target)

          print(f"Changed text files: {len(changed)}")
          print(f"Skipped legal/attribution files: {len(skipped_legal)}")
          for item in skipped_legal[:50]:
              print("LEGAL:", item)
          PY

      - name: Verify no non-attribution legacy branding remains
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          hits = []

          def skip(p: Path) -> bool:
              s = p.as_posix()
              name = p.name.upper()
              if ".git" in p.parts:
                  return True
              if len(p.parts) >= 2 and p.parts[0] == ".github" and p.parts[1] == "workflows":
                  return True
              if s == "LICENSE" or "/licenses/" in f"/{s.lower()}/":
                  return True
              if "LICENSE" in name or "NOTICE" in name or name == "UPSTREAM.MD":
                  return True
              if p.name.lower() == "copyright":
                  return True
              return False

          for p in Path(".").rglob("*"):
              if not p.is_file() or skip(p):
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              # Allowed references that must keep pointing to the real upstream owner.
              check = text.replace("metasequoiaime/", "")
              check = check.replace("metasequoiaime@gmail.com", "")
              found = sorted(set(re.findall(
                  r"水杉|Metasequoia(?:IME|Ime)?|METASEQUOIA|Shuishan|shuishan|metasequoiaime|metasequoia",
                  check,
              )))
              if found:
                  hits.append((p.as_posix(), found))

          print(f"Legacy branding hits outside legal/upstream references: {len(hits)}")
          for path, found in hits[:200]:
              print(path, ",".join(found))
          if hits:
              raise SystemExit(1)
          PY

      - name: Commit full rebrand
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No branding changes left."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Lingyao internal identifier rebrand [rebrand]"
          git push origin HEAD:develop
