name: Lingyao full rebrand

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Metasequoia/Shuishan branding with Lingyao
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(".")
          replacements = [
              ("水杉输入法", "灵耀输入法"),
              ("水杉 IME", "灵耀 IME"),
              ("水杉", "灵耀"),
              ("Metasequoia IME", "Lingyao IME"),
              ("MetasequoiaIME", "LingyaoIME"),
              ("MetasequoiaIme", "LingyaoIme"),
              ("Metasequoia", "Lingyao"),
              ("SHUISHAN", "LINGYAO"),
              ("Shuishan", "Lingyao"),
              ("shuishan", "lingyao"),
              ("https://github.com/metasequoiaime/msime", "https://github.com/Lcy040109/msime"),
              ("github.com/metasequoiaime/msime", "github.com/Lcy040109/msime"),
              ("metasequoiaime/msime", "Lcy040109/msime"),
          ]

          def legal_or_attribution(p: Path) -> bool:
              s = p.as_posix()
              name = p.name.upper()
              if s == "LICENSE":
                  return True
              if "/licenses/" in f"/{s.lower()}/":
                  return True
              if "LICENSE" in name or "NOTICE" in name or name == "UPSTREAM.MD":
                  return True
              if p.name.lower() == "copyright":
                  return True
              return False

          changed = []
          skipped_legal = []
          for p in root.rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              if len(p.parts) >= 2 and p.parts[0] == ".github" and p.parts[1] == "workflows":
                  continue
              if legal_or_attribution(p):
                  try:
                      txt = p.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  if any(a in txt for a, _ in replacements):
                      skipped_legal.append(p.as_posix())
                  continue
              try:
                  data = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              new = data
              for old, repl in replacements:
                  new = new.replace(old, repl)
              if new != data:
                  p.write_text(new, encoding="utf-8")
                  changed.append(p.as_posix())

          # Rename brand-bearing paths deepest-first so code references and file names stay aligned.
          candidates = sorted(
              [p for p in root.rglob("*") if ".git" not in p.parts and not (len(p.parts) >= 2 and p.parts[0] == ".github" and p.parts[1] == "workflows")],
              key=lambda p: len(p.parts),
              reverse=True,
          )
          for p in candidates:
              old_name = p.name
              new_name = old_name
              for old, repl in [
                  ("MetasequoiaIME", "LingyaoIME"),
                  ("MetasequoiaIme", "LingyaoIme"),
                  ("Metasequoia", "Lingyao"),
                  ("SHUISHAN", "LINGYAO"),
                  ("Shuishan", "Lingyao"),
                  ("shuishan", "lingyao"),
                  ("水杉", "灵耀"),
              ]:
                  new_name = new_name.replace(old, repl)
              if new_name != old_name and p.exists():
                  target = p.with_name(new_name)
                  if target.exists():
                      raise RuntimeError(f"rename collision: {p} -> {target}")
                  p.rename(target)

          print(f"Changed text files: {len(changed)}")
          print(f"Skipped legal/attribution files: {len(skipped_legal)}")
          if skipped_legal:
              print("\n".join(skipped_legal[:50]))
          PY

      - name: Verify no non-legal legacy branding remains
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = ["水杉", "Metasequoia", "METASEQUOIA", "shuishan", "Shuishan", "metasequoiaime"]
          hits = []
          def skip(p: Path) -> bool:
              s = p.as_posix()
              name = p.name.upper()
              if ".git" in p.parts:
                  return True
              if len(p.parts) >= 2 and p.parts[0] == ".github" and p.parts[1] == "workflows":
                  return True
              if s == "LICENSE" or "/licenses/" in f"/{s.lower()}/":
                  return True
              if "LICENSE" in name or "NOTICE" in name or name == "UPSTREAM.MD":
                  return True
              if p.name.lower() == "copyright":
                  return True
              return False
          for p in Path(".").rglob("*"):
              if not p.is_file() or skip(p):
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              found = [n for n in needles if n in text]
              if found:
                  hits.append((p.as_posix(), found))
          print(f"Legacy branding hits outside legal/attribution files: {len(hits)}")
          for path, found in hits[:200]:
              print(path, ",".join(found))
          if hits:
              raise SystemExit(1)
          PY

      - name: Commit full rebrand
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No branding changes left."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand product from 水杉 to 灵耀 [rebrand]"
          git push origin HEAD:develop
