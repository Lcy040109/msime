License: GPL-3.0-only
LicenseUrl: https://github.com/Lcy040109/msime/blob/develop/LICENSE
ShortDescription: "Lingyao IME (灵耀输入法): Chinese input method for Windows"
Description: |-
  Lingyao IME (灵耀输入法, LINGYAO) is a Chinese input method for Windows, macOS, Linux, Android, iOS and HarmonyOS. On Windows it is a Text Services Framework input method with its own Server process, a native candidate window and a settings app.

  LINGYAO is short for Lingyao IME; it has nothing to do with Microsoft IME.
Moniker: lingyao
Tags:
  - chinese
  - ime
  - input-method
  - pinyin
  - shuangpin
  - wubi
  - tsf
InstallationNotes: Uninstalling removes the input method's data directory, including your own dictionary words, settings and skins. Upgrading keeps it. Install as a signed-in user, not as SYSTEM (Intune, winget-autoupdate, scheduled tasks), because the data directory defaults to the installing account's local app data, which for SYSTEM lies inside C:\Windows, and the installer rejects it.
ReleaseNotesUrl: "@RELEASE_NOTES_URL@"
