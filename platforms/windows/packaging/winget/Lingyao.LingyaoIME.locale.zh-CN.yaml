InstallationNotes: 卸载会删除输入法的数据目录，包括自己加的词、设置和皮肤；升级会保留。请以登录的用户身份安装，不要以 SYSTEM 身份（Intune、winget-autoupdate、计划任务）：数据目录默认在安装账户的本地应用数据下，SYSTEM 的那个位于 C:\Windows 里，安装包会拒绝。
